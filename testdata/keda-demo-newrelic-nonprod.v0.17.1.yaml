---
apiVersion: v1
data:
  package.json: |
    {
      "name": "keda-demo-newrelic",
      "private": true,
      "dependencies": {
        "express": "^4.21.2",
        "newrelic": "^12.8.0"
      }
    }
  server.js: |
    'use strict';
    require('newrelic');
    const express = require('express');
    const port = Number(process.env.PORT || 8080);
    const app = express();
    app.all('*', (_req, res) => {
      res.send('ok');
    });
    app.listen(port, () => {
      console.log('listening on ' + port);
    });
